<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Raúl Eduardo Hernández García - Ejercicio 9</title>
  </head>
  <body>
    <h1>Formulario Espacial</h1>

    <form action="#" method="post">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" />

      <br /><br />

      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" name="correo" />

      <br /><br />

      <label>Tipo de Explorador:</label>
      <input type="radio" id="astronauta" name="tipo" value="astronauta" />
      <label for="astronauta">Astronauta</label>

      <input type="radio" id="cientifico" name="tipo" value="cientifico" />
      <label for="cientifico">Científico</label>

      <br /><br />

      <label>Intereses Espaciales:</label><br />
      <input type="checkbox" id="planetas" name="intereses" value="planetas" />
      <label for="planetas">Planetas</label>

      <input type="checkbox" id="galaxias" name="intereses" value="galaxias" />
      <label for="galaxias">Galaxias</label>

      <input type="checkbox" id="agujeros" name="intereses" value="agujeros" />
      <label for="agujeros">Agujeros Negros</label>

      <input type="checkbox" id="cohetes" name="intereses" value="cohetes" />
      <label for="cohetes">Cohetes Espaciales</label>

      <br /><br />

      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
